name: Update Judicial Data

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 8am UTC
  workflow_dispatch:      # manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch updated judicial data
        id: fetch
        continue-on-error: true   # still commit/deploy whatever was scraped
        run: node scripts/update-data.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/procesos.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update judicial data [skip ci]"
          git fetch origin master
          git rebase origin/master
          git push

      # Runs on every successful scrape, not only when data changed: gh-pages
      # skips the commit when the build is identical, and this lets the site
      # recover on its own if it ever falls behind master.
      - name: Build and deploy to GitHub Pages
        if: steps.fetch.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh-pages parses --user as an RFC 5322 address, which rejects the
          # brackets in "github-actions[bot]", so set the identity in git config.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm ci
          npm run build
          npx gh-pages -d build \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Fail the run if the judicial API was unreachable
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::The scrape could not list processes (judicial API and all proxies unreachable). Data was not refreshed."
          exit 1
